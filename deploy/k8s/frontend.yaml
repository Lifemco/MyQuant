apiVersion: apps/v1
kind: Deployment
metadata:
  name: myquant-frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: myquant-frontend}
  template:
    metadata:
      labels: {app: myquant-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: myquant-frontend
          ports: [{name: http, containerPort: 8080}]
          env: [{name: API_UPSTREAM, value: 'myquant-backend:8080'}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: myquant-frontend
spec:
  selector: {app: myquant-frontend}
  ports: [{name: http, port: 80, targetPort: http}]

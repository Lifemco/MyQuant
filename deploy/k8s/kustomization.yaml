apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: myquant
resources:
  - namespace.yaml
  - config.yaml
  - storage.yaml
  - backend.yaml
  - frontend.yaml
images:
  - name: myquant-backend
    newName: ghcr.io/your-org/myquant-backend
    newTag: replace-with-commit
  - name: myquant-frontend
    newName: ghcr.io/your-org/myquant-frontend
    newTag: replace-with-commit

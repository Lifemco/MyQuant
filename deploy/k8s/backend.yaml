apiVersion: apps/v1
kind: Deployment
metadata:
  name: myquant-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: myquant-backend}
  template:
    metadata:
      labels: {app: myquant-backend}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: myquant-backend
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: myquant-config}}]
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: myquant-llm, key: api-key, optional: true}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /api/health/ready, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/myquant}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: myquant-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: myquant-backend
spec:
  selector: {app: myquant-backend}
  ports: [{name: http, port: 8080, targetPort: http}]
